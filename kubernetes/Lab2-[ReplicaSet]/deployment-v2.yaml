apiVersion: apps/v1
kind: Deployment
metadata:
  name: bunny-page
  annotations:
    kubernetes.io/change-cause: "Updated image to rajv4rdhan/labops-bunny:latest"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: bunny-page
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: bunny-page
    spec:
      containers:
      - name: bunny-page
        image: rajv4rdhan/labops-bunny:latest
        ports:
        - containerPort: 8080