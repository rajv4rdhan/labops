apiVersion: apps/v1
kind: Deployment
metadata:
  name: bunny-page
spec:
  replicas: 3
  selector:
    matchLabels:
      app: bunny-page
  template:
    metadata:
      labels:
        app: bunny-page
    spec:
      containers:
      - name: bunny-page
        image: rajv4rdhan/labops-bunny:1.0.0
        ports:
        - containerPort: 8080