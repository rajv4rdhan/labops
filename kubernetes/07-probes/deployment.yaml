apiVersion: apps/v1
kind: Deployment
metadata:
  name: bunny-api
  namespace: labops
  labels:
    app: bunny-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bunny-api
  template:
    metadata:
      labels:
        app: bunny-api
    spec:
      containers:
        - name: bunny-api
          image: ghcr.io/your-org/labops-bunny-api:latest
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: bunny-db
                  key: DATABASE_URL
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
