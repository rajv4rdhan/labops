apiVersion: apps/v1
kind: Deployment
metadata:
  name: bunny-api
  namespace: labops
  labels:
    app: bunny-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bunny-api
  template:
    metadata:
      labels:
        app: bunny-api
    spec:
      containers:
        - name: bunny-api
          image: ghcr.io/your-org/labops-bunny-api:latest
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: bunny-db
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bunny-api
  namespace: labops
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bunny-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
