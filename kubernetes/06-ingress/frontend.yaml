apiVersion: apps/v1
kind: Deployment
metadata:
  name: bunny-page
  namespace: labops
  labels:
    app: bunny-page
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bunny-page
  template:
    metadata:
      labels:
        app: bunny-page
    spec:
      containers:
        - name: bunny-page
          image: ghcr.io/your-org/labops-bunny:latest
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: bunny-page
  namespace: labops
spec:
  type: ClusterIP
  selector:
    app: bunny-page
  ports:
    - name: http
      port: 80
      targetPort: 8080
