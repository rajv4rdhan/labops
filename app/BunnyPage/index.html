<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Quiet Meadow</title>
    <style>
        /* --- Core Styles & Typography --- */
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Poppins:wght@200;300&display=swap');

        :root {
            /* --- Golden Hour Sunset Palette --- */
            --sky-top: #fec89a;         /* Soft Apricot */
            --sky-bottom: #fde4cf;      /* Peach Puff */
            --hill-color: #582f0e;      /* Warm Umber */
            --bunny-color: #faf3e0;     /* Linen White */
            --inner-ear-color: #fbc4ab; /* Light Salmon */
            --text-color: #4e342e;      /* Dark Brown */
            --heading-font: 'Playfair Display', serif;
            --body-font: 'Poppins', sans-serif;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            background: linear-gradient(to bottom, var(--sky-top), var(--sky-bottom));
            font-family: var(--body-font);
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- Content & Layout --- */
        .content-container {
            text-align: left;
            max-width: 400px;
            padding: 2rem;
            z-index: 10;
            position: relative;
        }

        h1 {
            font-family: var(--heading-font);
            font-size: clamp(2.5rem, 6vw, 3.5rem);
            font-weight: 500;
            margin: 0 0 1rem 0;
            line-height: 1.2;
        }

        p {
            font-size: clamp(1rem, 2.5vw, 1.1rem);
            line-height: 1.7;
            margin: 0;
            font-weight: 300;
        }

        /* --- Scene Elements --- */
        .scene {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50%;
            z-index: 1;
        }

        .hill {
            position: absolute;
            bottom: 0;
            width: 150%;
            height: 100%;
            background: var(--hill-color);
            border-radius: 50% 50% 0 0;
            opacity: 0.8;
        }

        .hill-1 {
            left: -30%;
            bottom: -10%;
            transform: scale(1.1);
            background: #7a4b2e; /* Lighter hill in front */
        }
        
        .hill-2 {
            right: -25%;
            bottom: -20%;
            opacity: 0.9;
        }

        /* --- CSS Bunny Art --- */
        .bunny {
            position: absolute;
            bottom: 5vh;
            right: 15vw;
            width: 100px;
            height: 100px;
            z-index: 5;
            animation: peekaboo 10s ease-in-out infinite;
        }

        .bunny .head {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 70px;
            height: 60px;
            background: var(--bunny-color);
            border-radius: 50% 50% 45% 45% / 60% 60% 40% 40%;
            box-shadow: inset -3px -5px 10px rgba(0,0,0,0.04);
        }

        .bunny .ear {
            position: absolute;
            bottom: 40px;
            width: 20px;
            height: 55px;
            background: var(--bunny-color);
            border-radius: 10px 10px 0 0;
        }
        
        .bunny .ear::after {
            content: '';
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 35px;
            background: var(--inner-ear-color);
            border-radius: 5px 5px 0 0;
        }

        .bunny .ear--left {
            left: 10px;
            transform: rotate(-15deg);
        }

        .bunny .ear--right {
            right: 10px;
            transform: rotate(15deg);
            animation: earTwitch 10s ease-in-out infinite;
            animation-delay: -5s; /* Stagger animations */
        }

        .bunny .eye {
            position: absolute;
            top: 30px;
            width: 5px;
            height: 5px;
            background: var(--text-color);
            border-radius: 50%;
        }

        .bunny .eye--left {
            left: 20px;
        }
        
        .bunny .eye--right {
            right: 20px;
        }


        /* --- Animations --- */
        @keyframes peekaboo {
            0%, 100% {
                transform: translateY(20px);
            }
            50% {
                transform: translateY(0);
            }
            70%, 90% {
                transform: translateY(20px);
            }
            80% {
                transform: translateY(-5px);
            }
        }

        @keyframes earTwitch {
            0%, 40%, 60%, 100% { transform: rotate(15deg); }
            50% { transform: rotate(5deg); }
        }

        /* --- API Panel --- */
        .api-panel {
            position: absolute;
            top: 2rem;
            right: 2rem;
            max-width: 280px;
            padding: 1.25rem 1.5rem;
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(88, 47, 14, 0.12);
            z-index: 20;
        }

        .api-panel h2 {
            font-family: var(--heading-font);
            font-size: 1.1rem;
            font-weight: 500;
            margin: 0 0 0.75rem 0;
        }

        .api-panel ul {
            list-style: none;
            margin: 0;
            padding: 0;
            font-size: 0.95rem;
            line-height: 1.9;
        }

        .api-panel #api-status {
            margin: 0.75rem 0 0 0;
            font-size: 0.75rem;
            opacity: 0.7;
        }

    </style>
</head>
<body>

    <div class="content-container">
        <h1>A Quiet Meadow</h1>
        <p>Where stillness speaks and simple wonders bloom under a golden sky.</p>
    </div>

    <aside class="api-panel">
        <h2>Meadow Residents</h2>
        <ul id="bunny-list"><li>Loading…</li></ul>
        <p id="api-status"></p>
    </aside>

    <div class="scene">
        <div class="bunny">
            <div class="head">
                <div class="eye eye--left"></div>
                <div class="eye eye--right"></div>
            </div>
            <div class="ear ear--left"></div>
            <div class="ear ear--right"></div>
        </div>
        <div class="hill hill-1"></div>
        <div class="hill hill-2"></div>
    </div>

    <script>
        const list = document.getElementById('bunny-list');
        const status = document.getElementById('api-status');

        fetch('/api/bunnies')
            .then((res) => {
                if (!res.ok) {
                    throw new Error(`HTTP ${res.status}`);
                }
                return res.json();
            })
            .then((bunnies) => {
                list.innerHTML = '';
                if (!bunnies.length) {
                    list.innerHTML = '<li>The meadow is empty.</li>';
                    return;
                }
                for (const bunny of bunnies) {
                    const item = document.createElement('li');
                    item.textContent = `${bunny.name} · ${bunny.color}`;
                    list.appendChild(item);
                }
                status.textContent = `${bunnies.length} resident(s) from bunny-api`;
            })
            .catch((err) => {
                list.innerHTML = '<li>Unable to reach bunny-api.</li>';
                status.textContent = err.message;
            });
    </script>

</body>
</html>
