<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Quiet Meadow</title>
    <style>
        /* --- Core Styles & Typography --- */
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Poppins:wght@200;300&display=swap');

        :root {
            --sky-top: #d8d9ff;
            --sky-bottom: #f2e7f9;
            --hill-color: #7d84b2;
            --bunny-color: #f7f7f7;
            --inner-ear-color: #ead6e2;
            --text-color: #4a4e69;
            --heading-font: 'Playfair Display', serif;
            --body-font: 'Poppins', sans-serif;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            background: linear-gradient(to bottom, var(--sky-top), var(--sky-bottom));
            font-family: var(--body-font);
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- Content & Layout --- */
        .content-container {
            text-align: left;
            max-width: 400px;
            padding: 2rem;
            z-index: 10;
            position: relative;
        }

        h1 {
            font-family: var(--heading-font);
            font-size: clamp(2.5rem, 6vw, 3.5rem);
            font-weight: 500;
            margin: 0 0 1rem 0;
            line-height: 1.2;
        }

        p {
            font-size: clamp(1rem, 2.5vw, 1.1rem);
            line-height: 1.7;
            margin: 0;
            font-weight: 300;
        }

        /* --- Scene Elements --- */
        .scene {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50%;
            z-index: 1;
        }

        .hill {
            position: absolute;
            bottom: 0;
            width: 150%;
            height: 100%;
            background: var(--hill-color);
            border-radius: 50% 50% 0 0;
            opacity: 0.8;
        }

        .hill-1 {
            left: -30%;
            bottom: -10%;
            transform: scale(1.1);
            background: #9fa8da; /* Lighter hill in front */
        }
        
        .hill-2 {
            right: -25%;
            bottom: -20%;
            opacity: 0.9;
        }

        /* --- CSS Bunny Art --- */
        .bunny {
            position: absolute;
            bottom: 5vh;
            right: 15vw;
            width: 100px;
            height: 100px;
            z-index: 5;
            animation: peekaboo 10s ease-in-out infinite;
        }

        .bunny .head {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 70px;
            height: 60px;
            background: var(--bunny-color);
            border-radius: 50% 50% 45% 45% / 60% 60% 40% 40%;
            box-shadow: inset -3px -5px 10px rgba(0,0,0,0.04);
        }

        .bunny .ear {
            position: absolute;
            bottom: 40px;
            width: 20px;
            height: 55px;
            background: var(--bunny-color);
            border-radius: 10px 10px 0 0;
        }
        
        .bunny .ear::after {
            content: '';
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 35px;
            background: var(--inner-ear-color);
            border-radius: 5px 5px 0 0;
        }

        .bunny .ear--left {
            left: 10px;
            transform: rotate(-15deg);
        }

        .bunny .ear--right {
            right: 10px;
            transform: rotate(15deg);
            animation: earTwitch 10s ease-in-out infinite;
            animation-delay: -5s; /* Stagger animations */
        }

        .bunny .eye {
            position: absolute;
            top: 30px;
            width: 5px;
            height: 5px;
            background: var(--text-color);
            border-radius: 50%;
        }

        .bunny .eye--left {
            left: 20px;
        }

        /* --- Animations --- */
        @keyframes peekaboo {
            0%, 100% {
                transform: translateY(20px);
            }
            50% {
                transform: translateY(0);
            }
            70%, 90% {
                 transform: translateY(20px);
            }
            80% {
                transform: translateY(-5px);
            }
        }

        @keyframes earTwitch {
            0%, 40%, 60%, 100% { transform: rotate(15deg); }
            50% { transform: rotate(5deg); }
        }

    </style>
</head>
<body>

    <div class="content-container">
        <h1>A Quiet Meadow</h1>
        <p>Where stillness speaks and simple wonders bloom under a soft sky.</p>
    </div>

    <div class="scene">
        <div class="bunny">
            <div class="head">
                <div class="eye eye--left"></div>
            </div>
            <div class="ear ear--left"></div>
            <div class="ear ear--right"></div>
        </div>
        <div class="hill hill-1"></div>
        <div class="hill hill-2"></div>
    </div>

</body>
</html>
