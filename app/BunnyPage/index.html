<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Quiet Meadow</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐰</text></svg>">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap');

        :root {
            --sky-top: #cdeaff;
            --sky-bottom: #ffd8e8;
            --hill-back: #9fdc86;
            --hill-front: #6fc257;
            --bunny: #fffaf3;
            --inner-ear: #ffc2d4;
            --blush: #ffb3c6;
            --text: #4a3728;
            --card: rgba(255, 255, 255, 0.72);
        }

        * { box-sizing: border-box; }

        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            background: linear-gradient(to bottom, var(--sky-top), var(--sky-bottom));
            font-family: 'Fredoka', system-ui, sans-serif;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        /* --- Floating clouds --- */
        .cloud {
            position: absolute;
            background: #fff;
            border-radius: 100px;
            opacity: 0.85;
            filter: blur(1px);
            animation: drift linear infinite;
        }
        .cloud::before, .cloud::after {
            content: '';
            position: absolute;
            background: #fff;
            border-radius: 50%;
        }
        .cloud--1 { top: 14%; left: -30%; width: 120px; height: 40px; animation-duration: 38s; }
        .cloud--2 { top: 30%; left: -30%; width: 90px; height: 32px; animation-duration: 52s; animation-delay: -12s; }
        .cloud--3 { top: 8%; left: -30%; width: 150px; height: 46px; animation-duration: 64s; animation-delay: -30s; }

        @keyframes drift {
            from { transform: translateX(0); }
            to   { transform: translateX(140vw); }
        }

        /* --- Content --- */
        .card {
            position: relative;
            z-index: 10;
            background: var(--card);
            backdrop-filter: blur(10px);
            padding: 2.5rem 2.75rem;
            border-radius: 28px;
            box-shadow: 0 18px 45px rgba(120, 80, 120, 0.18);
            max-width: 440px;
            margin: 1.5rem;
            animation: pop 0.8s cubic-bezier(.2,.9,.3,1.4) both;
        }

        @keyframes pop {
            from { opacity: 0; transform: translateY(24px) scale(.94); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        h1 {
            font-size: clamp(2rem, 7vw, 2.9rem);
            font-weight: 600;
            margin: 0 0 0.5rem;
            letter-spacing: -0.5px;
        }

        p {
            font-size: clamp(1rem, 3vw, 1.1rem);
            line-height: 1.6;
            font-weight: 400;
            margin: 0;
            opacity: 0.85;
        }

        .hearts {
            margin-top: 1.25rem;
            font-size: 1.4rem;
            letter-spacing: 0.4rem;
        }
        .hearts span {
            display: inline-block;
            animation: bob 1.8s ease-in-out infinite;
        }
        .hearts span:nth-child(2) { animation-delay: .3s; }
        .hearts span:nth-child(3) { animation-delay: .6s; }

        @keyframes bob {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-6px); }
        }

        /* --- Meadow scene --- */
        .scene {
            position: absolute;
            inset: 0;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .hill {
            position: absolute;
            bottom: 0;
            border-radius: 50% 50% 0 0;
            background: var(--hill-back);
        }
        .hill--back {
            width: 160%;
            height: 42%;
            left: -30%;
            bottom: -8%;
            opacity: 0.85;
        }
        .hill--front {
            width: 170%;
            height: 34%;
            right: -35%;
            bottom: -10%;
            background: var(--hill-front);
        }

        /* --- CSS bunny --- */
        .bunny {
            position: absolute;
            bottom: 4vh;
            right: 12vw;
            width: 120px;
            height: 130px;
            z-index: 5;
            animation: hop 3.2s ease-in-out infinite;
        }

        @keyframes hop {
            0%, 100% { transform: translateY(6px); }
            50%      { transform: translateY(-4px); }
        }

        .bunny .ear {
            position: absolute;
            top: 0;
            width: 26px;
            height: 62px;
            background: var(--bunny);
            border-radius: 14px 14px 6px 6px;
            box-shadow: inset -2px -2px 4px rgba(0,0,0,0.05);
        }
        .bunny .ear::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 8px;
            transform: translateX(-50%);
            width: 12px;
            height: 42px;
            background: var(--inner-ear);
            border-radius: 8px;
        }
        .bunny .ear--left  { left: 22px; transform: rotate(-10deg); transform-origin: bottom center; }
        .bunny .ear--right { right: 22px; transform: rotate(10deg); transform-origin: bottom center; animation: twitch 3.2s ease-in-out infinite; }

        @keyframes twitch {
            0%, 70%, 100% { transform: rotate(10deg); }
            78%           { transform: rotate(2deg); }
            86%           { transform: rotate(12deg); }
        }

        .bunny .head {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 88px;
            height: 78px;
            background: var(--bunny);
            border-radius: 50% 50% 46% 46% / 58% 58% 42% 42%;
            box-shadow: inset -4px -6px 10px rgba(0,0,0,0.05);
        }

        .bunny .eye {
            position: absolute;
            top: 30px;
            width: 9px;
            height: 11px;
            background: var(--text);
            border-radius: 50%;
            animation: blink 4.5s infinite;
        }
        .bunny .eye--left  { left: 22px; }
        .bunny .eye--right { right: 22px; }

        @keyframes blink {
            0%, 92%, 100% { transform: scaleY(1); }
            95%           { transform: scaleY(0.1); }
        }

        .bunny .cheek {
            position: absolute;
            top: 46px;
            width: 14px;
            height: 9px;
            background: var(--blush);
            border-radius: 50%;
            opacity: 0.75;
        }
        .bunny .cheek--left  { left: 12px; }
        .bunny .cheek--right { right: 12px; }

        .bunny .nose {
            position: absolute;
            top: 44px;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 6px;
            background: var(--blush);
            border-radius: 50%;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; }
        }
    </style>
</head>
<body>

    <div class="scene">
        <div class="cloud cloud--1"></div>
        <div class="cloud cloud--2"></div>
        <div class="cloud cloud--3"></div>

        <div class="bunny">
            <div class="ear ear--left"></div>
            <div class="ear ear--right"></div>
            <div class="head">
                <div class="eye eye--left"></div>
                <div class="eye eye--right"></div>
                <div class="cheek cheek--left"></div>
                <div class="cheek cheek--right"></div>
                <div class="nose"></div>
            </div>
        </div>

        <div class="hill hill--back"></div>
        <div class="hill hill--front"></div>
    </div>

    <main class="card">
        <h1>A Quiet Meadow</h1>
        <p>Where stillness speaks and simple wonders bloom under a golden sky.</p>
        <div class="hearts" aria-hidden="true">
            <span>🌸</span><span>🐰</span><span>🌿</span>
        </div>
    </main>

</body>
</html>
