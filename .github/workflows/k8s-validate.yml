name: Validate Kubernetes Manifests

on:
  push:
    branches: [main]
    paths:
      - "kubernetes/**"
      - ".github/workflows/k8s-validate.yml"
  pull_request:
    paths:
      - "kubernetes/**"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate manifests
        run: kubeconform -strict -summary -ignore-missing-schemas kubernetes
