services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bunny}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bunny}
      POSTGRES_DB: ${POSTGRES_DB:-bunnies}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bunny} -d ${POSTGRES_DB:-bunnies}"]
      interval: 5s
      timeout: 5s
      retries: 10

  bunny-api:
    build: ./app/bunny-api
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-bunny}:${POSTGRES_PASSWORD:-bunny}@postgres:5432/${POSTGRES_DB:-bunnies}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8080"

  bunny-page:
    build: ./app/BunnyPage
    environment:
      PORT: "8080"
    ports:
      - "8080:8080"

  squirrel-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${SQUIRREL_DB_USER:-squirrel}
      POSTGRES_PASSWORD: ${SQUIRREL_DB_PASSWORD:-squirrel}
      POSTGRES_DB: ${SQUIRREL_DB_NAME:-squirrel}
    ports:
      - "5433:5432"
    volumes:
      - squirreldata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SQUIRREL_DB_USER:-squirrel} -d ${SQUIRREL_DB_NAME:-squirrel}"]
      interval: 5s
      timeout: 5s
      retries: 10

  squirrel-backend:
    build: ./app/squirrel/backend
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://${SQUIRREL_DB_USER:-squirrel}:${SQUIRREL_DB_PASSWORD:-squirrel}@squirrel-db:5432/${SQUIRREL_DB_NAME:-squirrel}?sslmode=disable
    depends_on:
      squirrel-db:
        condition: service_healthy
    ports:
      - "8083:8080"

  squirrel-frontend:
    build: ./app/squirrel/frontend
    environment:
      PORT: "8080"
      API_URL: http://squirrel-backend:8080
    depends_on:
      - squirrel-backend
    ports:
      - "8082:8080"

volumes:
  pgdata:
  squirreldata:
